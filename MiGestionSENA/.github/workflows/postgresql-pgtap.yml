name: PostgreSQL 16 - Validación de pgTAP

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:

  postgres-validation:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: migracionsena
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear carpeta evidencia
        run: |
          mkdir -p evidence

      - name: Mostrar estructura del proyecto
        run: |
          set -euo pipefail

          pwd
          ls -la
          find database -type f | sort

      - name: Instalar PostgreSQL 16 y pgTAP
        run: |
          set -euo pipefail

          sudo systemctl stop postgresql || true

          sudo apt-get update

          sudo apt-get install -y \
            postgresql \
            postgresql-contrib \
            postgresql-client \
            postgresql-16-pgtap \
            pgtap

      - name: Iniciar PostgreSQL
        run: |
          set -euo pipefail

          sudo systemctl start postgresql

          for i in {1..30}
          do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done

      - name: Crear base de datos de pruebas
        run: |
          set -euo pipefail

          sudo -u postgres psql \
            -c "ALTER USER postgres PASSWORD 'postgres';"

          psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -c "
              DROP DATABASE IF EXISTS migracionsena;
            "

          psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -c "
              CREATE DATABASE migracionsena;
            "

      - name: Verificar archivos requeridos
        run: |
          set -euo pipefail

          test -f database/schema/V001__schema.sql
          test -f database/schema/V002__catalogos.sql
          test -f database/schema/V003__modelo_mgs.sql
          test -f database/schema/V004__catalogo_tarea_esencial.sql
          test -f database/schema/V005__roles_permisos.sql
          test -f database/schema/V006__indices.sql
          test -f database/schema/V007__vistas.sql
          test -f database/schema/V008__functions_validation.sql
          test -f database/schema/V012__security_hardening.sql

          test -f database/test/V009__pgtap_setup.sql
          test -f database/test/V010__pgtap_tests.sql
          test -f database/test/V011__pgtap_teardown.sql

      - name: Registrar versiones
        run: |
          set -euo pipefail

          {
            echo "=== POSTGRES ==="
            psql --version

            echo
            echo "=== PGTAP ==="

            psql \
              -v ON_ERROR_STOP=1 \
              -d migracionsena \
              -c "
                CREATE EXTENSION IF NOT EXISTS pgtap;
              "

            psql \
              -v ON_ERROR_STOP=1 \
              -d migracionsena \
              -c "
                SELECT extname,
                       extversion
                FROM pg_extension
                WHERE extname='pgtap';
              "

          } | tee evidence/01_versions.txt

      - name: Ejecutar migraciones esquema
        run: |
          set -euo pipefail

          for file in \
            database/schema/V001__schema.sql \
            database/schema/V002__catalogos.sql \
            database/schema/V003__modelo_mgs.sql \
            database/schema/V004__catalogo_tarea_esencial.sql \
            database/schema/V005__roles_permisos.sql \
            database/schema/V006__indices.sql \
            database/schema/V007__vistas.sql \
            database/schema/V008__functions_validation.sql \
            database/schema/V012__security_hardening.sql
          do

            echo
            echo "=========================================="
            echo "Ejecutando: $file"
            echo "=========================================="

            psql \
              -v ON_ERROR_STOP=1 \
              -d migracionsena \
              -f "$file"

          done | tee evidence/02_schema_output.txt

      - name: Verificar roles V012
        run: |
          set -euo pipefail

          psql \
            -v ON_ERROR_STOP=1 \
            -d migracionsena \
            -c "
              SELECT rolname
              FROM pg_roles
              WHERE rolname LIKE 'mgs_%'
              ORDER BY rolname;
            " \
            | tee evidence/07_roles_output.txt

      - name: Ejecutar setup pgTAP
        run: |
          set -euo pipefail

          psql \
            -v ON_ERROR_STOP=1 \
            -d migracionsena \
            -f database/test/V009__pgtap_setup.sql \
            | tee evidence/03_setup_output.txt

      - name: Ejecutar pruebas pgTAP
        run: |
          set -euo pipefail

          psql \
            -v ON_ERROR_STOP=1 \
            -d migracionsena \
            -f database/test/V010__pgtap_tests.sql \
            | tee evidence/04_pgtap_output.txt

      - name: Ejecutar teardown
        if: always()
        run: |
          set -euo pipefail

          psql \
            -v ON_ERROR_STOP=1 \
            -d migracionsena \
            -f database/test/V011__pgtap_teardown.sql \
            | tee evidence/05_teardown_output.txt

      - name: Registrar commit
        if: always()
        run: |
          set -euo pipefail

          git rev-parse HEAD \
            | tee evidence/06_git_commit.txt

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-pgtap-evidence
          path: evidence/**
          if-no-files-found: warn